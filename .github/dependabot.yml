version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /services/orchestrator
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /images/tools
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /images/egress-guard
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
